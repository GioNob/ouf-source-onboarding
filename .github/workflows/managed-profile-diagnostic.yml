name: Managed profile minimized diagnostic
on: [push, pull_request]
permissions: {contents: read}
jobs:
  diagnostic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Exact owner API and unchanged profiler regressions
        run: |
          set -Eeuo pipefail
          bash scripts/install-authorization-sdk.sh
          mvn -B -ntp -Dtest=ManagedFileProfileDiagnosticTest,ManagedFileMcpApiTest,ManagedFileProfilerBomTest test
