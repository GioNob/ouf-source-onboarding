name: Managed profile 1024-column qualification
on:
  push:
    branches: ['feat/managed-profile-1024-20261107']
  pull_request:
    paths: ['src/**', '.github/workflows/wide-profile-1024.yml']
permissions: {contents: read}
jobs:
  native-wide-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: ouf_onboarding, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: ouf_onboarding}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_onboarding" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_ONB_DB_URL: jdbc:postgresql://localhost:5432/ouf_onboarding
      OUF_ONB_DB_USER: ouf_onboarding
      OUF_ONB_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: bash scripts/install-authorization-sdk.sh
      - name: Actual profiler, owned pages and complete idempotent draft
        run: >-
          mvn -B -ntp -DargLine=-Xmx384m
          -Dtest=ManagedFileExecutionProposalTest,ManagedWideProfileTest,ManagedWideProfileRuntimeTest,ManagedFileProfilerBomTest,ManagedFileMcpApiTest,ManagedProfileBudgetRuntimeTest,ManagedProfileFailureRuntimeTest
          test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-profile-1024-evidence-${{ github.run_id }}
          path: target/surefire-reports/
