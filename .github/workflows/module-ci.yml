name: Source Onboarding module CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java21-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ouf_onboarding
          POSTGRES_USER: ouf_onboarding
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_onboarding -d ouf_onboarding"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_ONB_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_onboarding
      OUF_ONB_DB_USER: ouf_onboarding
      OUF_ONB_DB_PASSWORD: ci-only-password
      MAVEN_OPTS: -Dmaven.wagon.http.connectionTimeout=10000 -Dmaven.wagon.http.readTimeout=30000 -Djava.net.preferIPv4Stack=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-api-gateway
          ref: 630a977055bdc2e224a5804bf17a8b30fe0a0a60
          path: .pairwise/permission-gateway
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r .pairwise/permission-gateway/requirements-dev.txt
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Verify frozen rc3 contract pin
        run: sh scripts/verify-contract-freeze.sh
      - name: Verify R4a Authorization lifecycle planner
        run: python -m unittest tests/test_r4a_authorization_lifecycle.py
      - name: Verify Keycloak scope and binding reconciliation
        run: |
          python -m pytest -q \
            tests/test_r4a_keycloak_client_scope_catalogue.py \
            tests/test_r4a_keycloak_client_scope_binding.py \
            tests/test_r4a_keycloak_human_device_client.py \
            tests/test_r4a_keycloak_workload_client.py \
            tests/test_r4a_keycloak_workload_secret_file.py \
            tests/test_r4a_human_token_scope_smoke.py \
            tests/test_r4a_human_grant_lifecycle.py \
            tests/test_r4a_onboarding_gateway_auth_smoke.py
      - name: Verify Onboarding workload token claim inspector
        run: python -m unittest tests.test_r4a_verify_onboarding_workload_token
      - name: Verify R4a admin grant manifest and private deploy snapshot
        run: python -m unittest tests.test_r4a_admin_all_human_manifest tests.test_r4a_admin_human_scope_bindings tests.test_r4a_stage_deploy_snapshot tests.test_r4a_minio_staging_bootstrap
      - name: Verify Onboarding staged rollout failure recovery
        run: python -m unittest tests.test_r4a_onboarding_rollout tests.test_r4a_onboarding_failed_rollout_reconcile
      - name: Compile, test and package
        run: |
          bash scripts/install-authorization-sdk.sh
          export OUF_GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/permission-gateway"
          timeout --signal=TERM --kill-after=30s 20m mvn -B -ntp clean verify
      - name: Verify shared SDK production packaging
        run: |
          jar tf target/source-onboarding-*.jar > target/sdk-packaging.txt
          grep -q 'BOOT-INF/lib/authorization-sdk-1.2.0.jar' target/sdk-packaging.txt
          if grep -q 'authorization-sdk-1.2.0-tests.jar' target/sdk-packaging.txt; then exit 1; fi
      - name: Build non-root container
        run: |
          docker build -t ouf-source-onboarding:${{ github.sha }} .
          test "$(docker image inspect ouf-source-onboarding:${{ github.sha }} --format '{{.Config.User}}')" = "10003:10003"
      - name: Scan exact production image including unfixed HIGH CRITICAL UNKNOWN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ouf-source-onboarding:${{ github.sha }}
          format: json
          output: target/trivy-image.json
          list-all-pkgs: true
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          ignore-unfixed: false
          exit-code: 1
      - name: Boot image with managed-file staging enabled
        run: timeout --signal=TERM --kill-after=10s 3m bash scripts/ci_r4a_staging_container_smoke.sh ouf-source-onboarding:${{ github.sha }}
      - name: Preserve tested image for governed delivery
        if: github.event_name == 'pull_request'
        env:
          OUF_REVIEWED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p target/governed-image
          docker save "ouf-source-onboarding:${{ github.sha }}" | gzip -n > target/governed-image/image.tar.gz
          python3 - <<'PYIMAGE'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path('target/governed-image');archive=root/'image.tar.gz'
          def command(*args):return subprocess.check_output(args,text=True).strip()
          tested=command('git','rev-parse','HEAD');reviewed=os.environ['OUF_REVIEWED_SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}',reviewed) or not re.fullmatch('[a-f0-9]{40}',tested):raise SystemExit(2)
          checksum=hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda:stream.read(1048576),b''):checksum.update(block)
          image='ouf-source-onboarding:'+os.environ['GITHUB_SHA']
          value={'schema':'ouf.onboarding-tested-image.v1','repository':os.environ['GITHUB_REPOSITORY'],
              'reviewedSourceCommit':reviewed,'testedCommit':tested,'testedTree':command('git','rev-parse','HEAD^{tree}'),
              'workflowRunId':os.environ['GITHUB_RUN_ID'],'workflowRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'imageTag':image,'imageId':command('docker','image','inspect',image,'--format','{{.Id}}'),
              'archiveName':archive.name,'archiveSha256':checksum.hexdigest(),'archiveBytes':archive.stat().st_size,
              'sourceSchemaMigration':'V34__managed_readiness_budget_sessions.sql','qualifiedInCiOnly':True,
              'targetApplyAuthorized':False,'humanBudgetGranted':False,'releaseAcceptance':False}
          (root/'manifest.json').write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n')
          (root/'SHA256SUMS').write_text(value['archiveSha256']+'  image.tar.gz\n')
          print('Tested image preserved; target authorization remains false.')
          PYIMAGE
      - name: Upload tested image without publishing a release
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: source-onboarding-governed-image-${{ github.run_id }}
          path: target/governed-image/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-onboarding-evidence-${{ github.run_id }}
          path: |
            target/surefire-reports/
            authorization-sdk/target/surefire-reports/
            authorization-sdk/SOURCE_SHA256SUMS
            target/sdk-packaging.txt
            target/trivy-image.json
          if-no-files-found: warn
