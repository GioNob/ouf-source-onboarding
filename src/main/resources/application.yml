spring:
  # Preserve the owner JSON/JsonNode contract while GeoTools also loads patched Jackson 3.
  http.converters.preferred-json-mapper: jackson2
  application.name: ouf-source-onboarding
  datasource:
    url: ${OUF_ONB_DB_URL:jdbc:postgresql://127.0.0.1:5432/ouf_onboarding}
    username: ${OUF_ONB_DB_USER}
    password: ${OUF_ONB_DB_PASSWORD}
  flyway:
    schemas: ouf_onboarding
    default-schema: ouf_onboarding
    create-schemas: true
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
ouf:
  onboarding:
    acquisition-limits:
      max-rows: ${OUF_ONB_ACQUISITION_LIMITS_MAX_ROWS:1000000}
      max-columns: ${OUF_ONB_ACQUISITION_LIMITS_MAX_COLUMNS:1024}
      max-cell-chars: ${OUF_ONB_ACQUISITION_LIMITS_MAX_CELL_CHARS:1000000}
      margin-percent: ${OUF_ONB_ACQUISITION_LIMITS_MARGIN_PERCENT:25}
      min-headroom-rows: ${OUF_ONB_ACQUISITION_LIMITS_MIN_HEADROOM_ROWS:100}
      min-headroom-columns: ${OUF_ONB_ACQUISITION_LIMITS_MIN_HEADROOM_COLUMNS:8}
      min-headroom-cell-chars: ${OUF_ONB_ACQUISITION_LIMITS_MIN_HEADROOM_CELL_CHARS:1024}
    wait-max-seconds: ${OUF_ONB_WAIT_MAX_SECONDS:3600}
    handoff-retention-seconds: ${OUF_ONB_HANDOFF_RETENTION_SECONDS:86400}
    approval-challenge-ttl: PT10M
    semantic:
      gateway-url: ${OUF_ONB_SEMANTIC_GATEWAY_URL:}
      token-file: ${OUF_ONB_SEMANTIC_TOKEN_FILE:}
    udp-identity:
      gateway-url: ${OUF_ONB_UDP_IDENTITY_GATEWAY_URL:}
      token-file: ${OUF_ONB_UDP_IDENTITY_TOKEN_FILE:}
    profile-worker:
      id: ${OUF_ONB_PROFILE_WORKER_ID:onboarding-profiler}
      lease: ${OUF_ONB_PROFILE_WORKER_LEASE:PT2M}
      retry-delay: ${OUF_ONB_PROFILE_RETRY_DELAY:PT30S}
      poll-delay-ms: ${OUF_ONB_PROFILE_POLL_DELAY_MS:1000}
    preview:
      max-response-bytes: ${OUF_ONB_PREVIEW_MAX_RESPONSE_BYTES:786432}
      cursor-key-file: ${OUF_ONB_PREVIEW_CURSOR_KEY_FILE:}
      cursor-ttl: ${OUF_ONB_PREVIEW_CURSOR_TTL:PT15M}
    log-export-worker:
      id: ${OUF_ONB_LOG_EXPORT_WORKER_ID:ths-log-export}
      lease: ${OUF_ONB_LOG_EXPORT_WORKER_LEASE:PT2M}
      retention: ${OUF_ONB_LOG_EXPORT_RETENTION:PT1H}
      poll-delay-ms: ${OUF_ONB_LOG_EXPORT_POLL_DELAY_MS:1000}
