<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recupero acquisizione · OUF</title>
  <link rel="stylesheet" href="recovery.css">
  <script src="recovery.js" defer></script>
</head>
<body>
  <main>
    <h1>Recupero acquisizione</h1>
    <p id="status" role="status" aria-live="polite">Caricamento dello stato dell’acquisizione…</p>
    <article id="run" hidden>
      <h2>Stato dell’acquisizione</h2>
      <dl>
        <dt>Fonte</dt><dd id="source"></dd>
        <dt>Identificativo del run</dt><dd id="run-id"></dd>
        <dt>Stato</dt><dd id="run-state"></dd>
        <dt>Motivo della sospensione</dt><dd id="cause"></dd>
      </dl>
      <h2>Effetti registrati</h2>
      <p id="effects"></p>
      <h2>Budget di recupero</h2>
      <p id="budget"></p>
    </article>
    <section id="decision" hidden>
      <h2>Decidi come procedere</h2>
      <form>
        <fieldset id="choices">
          <legend>Scegli un’azione</legend>
          <label id="resume-option">
            <input type="radio" name="action" value="resume">
            <span><strong>Riprendi</strong><br>Autorizza fino a 128 tentativi entro 24 ore. Ingestion verifica i prerequisiti e riparte dal progresso conservato. La decisione non garantisce la ripartenza.</span>
          </label>
          <label>
            <input type="radio" name="action" value="abort">
            <span><strong>Interrompi</strong><br>Chiude il run e ferma il lavoro residuo. Le scritture già effettuate restano valide e gli invii in corso possono richiedere verifiche.</span>
          </label>
          <button id="confirm" type="submit" disabled>Conferma decisione</button>
        </fieldset>
      </form>
    </section>
    <button id="reload" type="button" hidden>Rileggi lo stato</button>
  </main>
</body>
</html>
