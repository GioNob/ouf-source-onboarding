<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OUF · Importa CSV</title><script src="picker.js" defer></script></head>
<body>
<main>
  <h1>Importa un CSV in OUF</h1>
  <p>Seleziona un file dal tuo computer. Il caricamento passa dal Gateway OUF.</p>
  <form id="upload"><label for="file">File CSV</label> <input id="file" type="file" accept=".csv,text/csv" required><button id="send" type="submit">Carica file</button></form>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="result" hidden></p>
</main>
</body>
</html>
