  "components": {
    "securitySchemes": {
      "trustedHuman": {
        "type": "http",
        "scheme": "bearer",
        "description": "Validated by the trusted authentication adapter and bound as TrustedPrincipal; mutations also require server-validated CSRF context."
      }
    },
    "schemas": {
      "CapabilityDescriptor": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "capabilityId": {
            "type": "string",
            "minLength": 1
          },
          "operation": {
            "type": "string",
            "minLength": 1
          },
          "requiredScope": {
            "type": "string",
            "minLength": 1
          },
          "allowedActors": {
            "type": "array",
            "minItems": 1,
            "items": {
              "enum": [
                "HUMAN",
                "SERVICE",
                "AI_AGENT"
              ]
            }
          }
        },
        "required": [
          "capabilityId",
          "operation",
          "requiredScope",
          "allowedActors"
        ]
      },
      "Registration": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "ownerRef": {
            "type": "string",
            "minLength": 1
          },
          "descriptor": {
            "$ref": "#/components/schemas/CapabilityDescriptor"
          }
        },
        "required": [
          "ownerRef",
          "descriptor"
        ]
      },
      "GrantConstraints": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "effect": {
            "enum": [
              "ALLOW",
              "DENY",
              null
            ]
          },
          "externalRoleRef": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1
          },
          "resourceType": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1
          },
          "resourceId": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1
          },
          "resourceAttributes": {
            "type": [
              "object",
              "null"
            ],
            "additionalProperties": {
              "type": "string"
            }
          },
          "allowedDataLabels": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "allowedDetailLevels": {
            "type": [
              "array",
