{
  "openapi": "3.1.0",
  "info": {
    "title": "OUF Authorization administration",
    "version": "1.1.0",
    "description": "Trusted HUMAN authorization administration. Bootstrap designates a protected superadmin by trusted IAM issuer, tenant and organizational role. Ordinary policy bundles cannot modify that association. Role handover requires a version-bound proposal and confirmation by a verified holder of the target role. No MCP exposure; trusted write proof and authorization.policy.admin OAuth scope remain mandatory. See docs/OUF_ADMIN_BOOTSTRAP.md."
  },
  "security": [
    {
      "trustedHuman": []
    }
  ],
  "paths": {
    "/api/trusted-human/v1/authorization/capabilities": {
      "get": {
        "operationId": "get_capabilities",
        "x-ouf-required-capability": "authorization.policy.admin",
        "x-ouf-human-only": true,
        "x-ouf-mcp-exposed": false,
        "responses": {
          "200": {
            "description": "Success. Draft responses include the current quoted revision in ETag."
          },
          "400": {
            "description": "Malformed or unsupported policy condition"
          },
          "403": {
            "description": "Missing trusted HUMAN principal, capability or validated CSRF context"
          },
          "409": {
            "description": "Immutable capability, active bundle conflict or non-editable draft"
          },
          "412": {
            "description": "Stale ETag"
          },
          "428": {
            "description": "If-Match required"
          }
        }
