openapi: 3.1.0
info:
  title: OUF Source Onboarding API
  version: 1.0.0
  description: Managed-file onboarding control-plane capabilities. Runtime ingestion is explicitly outside this API.
servers:
  - url: /api/onboarding/v1
security:
  - bearerAuth: []
paths:
  /prepare:
    servers: [{url: /api/internal/v1/onboarding/source-revision-mcp}]
    post:
      operationId: prepareSourceRevision
      parameters:
        - {name: X-OUF-Source-Revision-Receipt, in: header, required: true, schema: {type: string}}
        - {name: If-Match, in: header, description: Required for asset replacement, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Arguments]
              properties:
                Arguments: {$ref: '#/components/schemas/RevisionArguments'}
      responses:
        '200': {description: Prepared revision or reconciled command}
        default: {$ref: '#/components/responses/Problem'}
  /sources:
    get:
      operationId: listSources
      x-ouf-mcp-capability: ouf.source.list
      parameters: [{name: after, in: query, required: false, schema: {type: string}}, {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
      responses: {'200': {description: Cursor-ordered source page}, default: {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createSource
      x-ouf-mcp-capability: ouf.source.create
      responses: {'201': {description: Source created}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}:
    get:
      operationId: getSource
      x-ouf-mcp-capability: ouf.source.get
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses: {'200': {description: Source detail}, default: {$ref: '#/components/responses/Problem'}}
    patch:
      operationId: updateSource
      x-ouf-mcp-capability: ouf.source.update
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: If-Match, in: header, required: true, schema: {type: string}}]
      responses: {'200': {description: Mutable source metadata updated}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions:
    post:
      operationId: createOnboardingVersion
      x-ouf-mcp-capability: ouf.source-onboarding.version.create
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses: {'201': {description: DRAFT created}, default: {$ref: '#/components/responses/Problem'}}
  /managed-files:
    post:
      operationId: registerManagedFile
      summary: Register a file already uploaded to governed staging
      x-ouf-mcp-capability: ouf.managed-source.file.upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterManagedFileRequest'
      responses:
        '201':
          description: ManagedFileAsset registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedFileAsset'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/profile:
    post:
      operationId: requestManagedFileProfile
      summary: Queue deterministic profiling
      x-ouf-mcp-capability: ouf.managed-source.file.profile
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '202':
          description: Profiling job accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileProfileJob'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/profile-jobs/{jobId}:
    get:
      operationId: getManagedFileProfileJob
      summary: Get profiling job state
      x-ouf-mcp-capability: ouf.managed-source.file.profile
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current profiling job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileProfileJob'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/profiles/{profileId}:
    get:
      operationId: getManagedFileProfile
      summary: Get immutable technical profile
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Immutable FileProfile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileProfile'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/profiles/{profileId}/preview:
    get:
      operationId: previewManagedFileOnboarding
      summary: Preview schema, redacted sample, candidate keys and row-object proposal
      x-ouf-mcp-capability: ouf.managed-source.preview
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Governed preview safe for an agent or UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedFilePreview'
        default:
          $ref: '#/components/responses/Problem'
  /managed-file-mcp/create:
    servers: [{url: /api/internal/v1/onboarding}]
    post:
      operationId: createManagedFileDraftForMcp
      parameters:
        - {name: X-OUF-Managed-File-Receipt, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Arguments, CorrelationID]
              properties:
                CorrelationID: {type: string}
                Arguments:
                  type: object
                  additionalProperties: false
                  required: [sourceId, name, owner, targetClassIri, semanticRefs, sourceObjectKeyFields, fields]
                  anyOf: [{required: [assetId, profileId]}, {required: [unitProfileRef]}]
                  properties:
                    assetId: {$ref: '#/components/schemas/UnitUuid'}
                    profileId: {$ref: '#/components/schemas/UnitUuid'}
                    sourceId: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/sourceId'}
                    name: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/name'}
                    owner: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/owner'}
                    targetClassIri: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/targetClassIri'}
                    semanticRefs: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/semanticRefs'}
                    sourceObjectKeyFields: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/sourceObjectKeyFields'}
                    fields: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/fields'}
                    layer: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/layer'}
                    category: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/category'}
                    compositions: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/compositions'}
                    semanticBindings: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/semanticBindings'}
                    unitProfileRef: {$ref: '#/components/schemas/CreateManagedFileOnboardingRequest/properties/unitProfileRef'}
      responses:
        '200': {description: Idempotent DRAFT receipt}
        '404': {description: ONB_FILE_PROFILE_NOT_FOUND or ONB_PROFILE_UNIT_NOT_FOUND}
        '409': {description: ONB_UNIT_PROFILE_CHANGED or ONB_UNIT_SCHEMA_CHANGED or ONB_UNIT_SELECTION_CHANGED or ONB_UNIT_ALREADY_BOUND or ONB_UNIT_ASSET_ALREADY_BOUND}
        '422': {description: ONB_UNIT_REJECTED or ONB_UNIT_FORMAT_UNSUPPORTED or ONB_UNIT_PROFILE_OUTDATED}
  /managed-file-mcp/review-prepare:
    servers: [{url: /api/internal/v1/onboarding}]
    post:
      operationId: prepareManagedFileReview
      x-ouf-mcp-capability: ouf.managed-source.onboarding.review.prepare
      parameters:
        - {name: X-OUF-Managed-File-Receipt, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Arguments]
              properties:
                Arguments:
                  type: object
                  required: [sourceId, onboardingVersionId, expectedVersion, commandKey]
                  properties:
                    sourceId: {type: string}
                    commandKey: {type: string}
                    expectedVersion: {type: integer, minimum: 0}
                    unitProfileRef: {$ref: '#/components/schemas/SourceUnitReference'}
                    onboardingVersionId: {type: string, format: uuid}
                    candidateAction: {enum: [WITHDRAW, RESTART_DRAFT]}
                    executionProposal:
                      oneOf:
                        - {$ref: '../docs/contracts/managed-file-execution-proposal.schema.json'}
                        - {$ref: '#/components/schemas/ManagedUnitExecutionProposal'}
      responses:
        '200': {description: Prepared review receipt}
        '409': {description: ONB_UNIT_PROFILE_CHANGED or ONB_UNIT_SCHEMA_CHANGED or ONB_UNIT_SELECTION_CHANGED}
        default: {$ref: '#/components/responses/Problem'}
  /managed-file-mcp/preview:
    servers: [{url: /api/internal/v1/onboarding}]
    post:
      operationId: previewManagedFileForMcp
      summary: Read a retained profile, profile job, column page, or tenant-owned asset list
      x-ouf-mcp-capability: ouf.managed-source.preview
      description: |
        Owner route for Gateway delegation of source.file.preview. Each request requires a fresh bound
        preview receipt. Column pages and access to retained distinct values require proven tenant and
        subject ownership. Historical subject-owned previews without tenant proof expose counts only.
        Profile, job-profile and COLUMNS bodies are bounded after JSON escaping in UTF-8.
        Configure ouf.onboarding.preview.max-response-bytes (8192–786432, default 786432).
        A shared, dedicated owner key file (ouf.onboarding.preview.cursor-key-file, 32 bytes encoded
        as 64 hexadecimal digits) keeps cursors verifiable across replicas and restarts. With the
        key file unset, cursors are process-local.
        Configure ouf.onboarding.preview.cursor-ttl (minimum PT1S, default PT15M).
      parameters:
        - {name: X-OUF-Managed-File-Receipt, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Arguments]
              properties:
                Arguments:
                  oneOf:
                    - type: object
                      required: [assetId, profileId]
                      additionalProperties: false
                      properties:
                        assetId: {type: string, format: uuid}
                        profileId: {type: string, format: uuid}
                    - type: object
                      required: [assetId, jobId]
                      additionalProperties: false
                      properties:
                        assetId: {type: string, format: uuid}
                        jobId: {type: string, format: uuid}
                    - type: object
                      required: [view, assetId, profileId]
                      additionalProperties: false
                      properties:
                        view: {const: COLUMNS}
                        assetId: {type: string, format: uuid}
                        profileId: {type: string, format: uuid}
                        layer: {type: string, minLength: 1, description: Exact layer or table name for a layered profile.}
                        offset: {type: integer, minimum: 0, default: 0}
                        limit: {type: integer, minimum: 1, maximum: 128, default: 128}
                        distinctValuesCursor:
                          $ref: '#/components/schemas/DistinctValuesCursor'
                          description: Continue the retained values of a single column. Send only view, assetId, profileId and this cursor.
                      if: {required: [distinctValuesCursor]}
                      then:
                        not:
                          anyOf: [{required: [offset]}, {required: [limit]}, {required: [layer]}]
                    - {"type":"object","additionalProperties":false,"required":["view","profileId"],"properties":{"view":{"const":"UNITS"},"profileId":{"$ref":"#/components/schemas/UnitUuid"},"assetId":{"$ref":"#/components/schemas/UnitUuid"},"offset":{"type":"integer","minimum":0,"maximum":63},"limit":{"type":"integer","minimum":1,"maximum":64}}}
                    - {"type":"object","additionalProperties":false,"required":["view","profileId","unitRef"],"properties":{"view":{"const":"UNIT"},"profileId":{"$ref":"#/components/schemas/UnitUuid"},"unitRef":{"$ref":"#/components/schemas/UnitRef"},"assetId":{"$ref":"#/components/schemas/UnitUuid"},"offset":{"type":"integer","minimum":0,"maximum":1023},"limit":{"type":"integer","minimum":1,"maximum":128}}}
                    - {"type":"object","additionalProperties":false,"required":["view","profileId","unitRef","distinctValuesCursor"],"properties":{"view":{"const":"UNIT"},"profileId":{"$ref":"#/components/schemas/UnitUuid"},"unitRef":{"$ref":"#/components/schemas/UnitRef"},"assetId":{"$ref":"#/components/schemas/UnitUuid"},"distinctValuesCursor":{"type":"string","minLength":1}}}
                    - type: object
                      required: [view]
                      additionalProperties: false
                      properties:
                        view: {const: ASSETS}
                        limit: {type: integer, minimum: 1, maximum: 50, default: 20}
                        afterAssetId: {type: string, format: uuid}
      responses:
        '200':
          description: |
            An exact profile, job, column page or asset list. A COLUMNS page can return fewer than
            limit columns. To continue through columns, use nextOffset while hasMore is true.
            A request with distinctValuesCursor returns one column at its original offset, with
            hasMore false and nextOffset null. Follow its distinctValuesCursor until
            distinctValuesComplete is true. This sequence is independent of column-page traversal.
            A successful profile job uses resultRef as the profileId for continuations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMcpPreviewResponse'
        '400':
          description: Invalid request. An invalid, expired, altered or mismatched cursor returns ONB_DISTINCT_VALUES_CURSOR_INVALID.
          content:
            application/problem+json:
              schema: {$ref: '#/components/responses/Problem/content/application~1problem+json/schema'}
        '422':
          description: Irreducible profile metadata exceeds the configured budget (ONB_PROFILE_PREVIEW_BUDGET_EXCEEDED).
          content:
            application/problem+json:
              schema: {$ref: '#/components/responses/Problem/content/application~1problem+json/schema'}
        default:
          $ref: '#/components/responses/Problem'
  /ths-links/ingestion-run-recovery:
    servers: [{url: /api/internal/v1/onboarding}]
    post:
      operationId: createIngestionRunRecoveryThsLink
      summary: Present a link to the Ingestion run recovery card hosted by Onboarding
      x-ouf-mcp-capability: ouf.onboarding.ths-links.ingestion-run-recovery
      description: |
        The Gateway delegates a HUMAN read with a managed-file owner receipt bound to this route and
        the exact JSON body. Onboarding verifies tenant and subject ownership of the managed source.
        The THS and Ingestion verify the run and its current version before any decision.
      parameters:
        - {name: X-OUF-Managed-File-Receipt, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, runId, expectedVersion]
              additionalProperties: false
              properties:
                sourceId: {type: string, minLength: 1, maxLength: 160}
                runId: {type: string, format: uuid, pattern: '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$'}
                expectedVersion: {type: integer, minimum: 0, maximum: 9007199254740991}
      responses:
        '200':
          description: Link and its presentation expiry, independent of Ingestion's decisionDeadline.
          headers:
            Cache-Control: {schema: {const: no-store}}
          content:
            application/json:
              schema:
                type: object
                required: [reviewUrl, expiresAt]
                additionalProperties: false
                properties:
                  reviewUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
        '400':
          description: Invalid body (ONB_THS_LINK_ARGUMENTS_INVALID).
          content:
            application/problem+json:
              schema: {$ref: '#/components/responses/Problem/content/application~1problem+json/schema'}
        '403':
          description: Invalid receipt or unproven managed source owner scope.
        '503':
          description: Missing or invalid ouf.authorization.ths.public-origin (ONB_THS_LINK_ORIGIN_REQUIRED), or owner persistence unavailable.
          content:
            application/problem+json:
              schema: {$ref: '#/components/responses/Problem/content/application~1problem+json/schema'}
        default:
          $ref: '#/components/responses/Problem'
  /ths-links/semantic-review:
    servers: [{url: /api/internal/v1/onboarding}]
    post:
      operationId: createSemanticReviewThsLink
      summary: Present a link to the semantic review page hosted by Onboarding
      x-ouf-internal-capability: ouf.onboarding.ths-links.semantic-review
      security: [{managedFileOwnerReceipt: []}]
      description: |
        This internal MCP-to-Gateway operation requires a managed-file owner receipt with a HUMAN
        tenant and subject, bound to the route and exact JSON body. The link opens the semantic
        workflow-review page. On opening it, the THS uses the HUMAN session to fetch the current
        challenge from Semantic Registry, which checks challenge ownership and state. Link issuance
        carries no decision authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId]
              additionalProperties: false
              properties:
                challengeId: {type: string, format: uuid, pattern: '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$'}
      responses:
        '200':
          description: Link on the configured THS origin and its UTC presentation expiry, independent of the challenge expiry.
          headers:
            Cache-Control: {schema: {const: no-store}}
          content:
            application/json:
              schema:
                type: object
                required: [reviewUrl, expiresAt]
                additionalProperties: false
                properties:
                  reviewUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
        '400':
          description: Invalid body (ONB_THS_LINK_ARGUMENTS_INVALID).
          content:
            application/problem+json:
              schema: {$ref: '#/components/responses/Problem/content/application~1problem+json/schema'}
        '403':
          description: Missing or invalid HUMAN delegation (ONB_MANAGED_FILE_RECEIPT_INVALID).
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {const: ONB_MANAGED_FILE_RECEIPT_INVALID}
        '503':
          description: Missing or invalid ouf.authorization.ths.public-origin (ONB_THS_LINK_ORIGIN_REQUIRED).
          content:
            application/problem+json:
              schema: {$ref: '#/components/responses/Problem/content/application~1problem+json/schema'}
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/preview:
    get:
      operationId: previewManagedExtractionUnit
      parameters:
        - {name: assetId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: profileId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: view, in: query, required: true, schema: {enum: [UNITS, UNIT]}}
        - {name: unitRef, in: query, schema: {$ref: '#/components/schemas/UnitRef'}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1023}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 128}}
        - {name: distinctValuesCursor, in: query, schema: {$ref: '#/components/schemas/DistinctValuesCursor'}}
      responses:
        '200':
          description: Immutable inventory or selected unit.
          content:
            application/json:
              schema:
                oneOf: [{$ref: '#/components/schemas/SourceUnitInventory'}, {$ref: '#/components/schemas/SourceUnitProfile'}]
        '404': {description: ONB_FILE_PROFILE_NOT_FOUND or ONB_PROFILE_UNIT_NOT_FOUND}
        '409': {description: ONB_UNIT_SELECTION_CHANGED or ONB_UNIT_PROFILE_CHANGED or ONB_UNIT_SCHEMA_CHANGED or ONB_UNIT_ASSET_ALREADY_BOUND or ONB_UNIT_ALREADY_BOUND}
        '422': {description: ONB_UNIT_REJECTED or ONB_UNIT_FORMAT_UNSUPPORTED or ONB_UNIT_PROFILE_OUTDATED}
  /managed-files/{assetId}/create-onboarding:
    post:
      operationId: createManagedFileOnboarding
      summary: Create an INTERNAL_MANAGED source and DRAFT configuration
      x-ouf-mcp-capability: ouf.managed-source.onboarding.create
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: profileId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedFileOnboardingRequest'
      responses:
        '201':
          description: Governed onboarding DRAFT created; no ingestion has started
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  deferredReaderChecks:
                    type: array
                    items:
                      type: object
                      required: [fieldName, transform]
                      properties:
                        fieldName: {type: string}
                        transform: {type: string}
        '409':
          description: Asset binding conflict. Resolutions depend on current authority and source state.
          content:
            application/problem+json:
              schema:
                allOf:
                  - {$ref: '#/components/responses/Problem/content/application~1problem+json/schema'}
                  - type: object
                    properties:
                      boundSourceId: {type: string, description: Present only for a readable source.}
                      resolutions: {type: array, items: {enum: [CREATE_REVISION, UPLOAD_NEW_FILE]}}
        '422':
          description: ONB_READER_UNSUPPORTED includes each rejected field and its allowed alternatives.
          content:
            application/problem+json:
              schema:
                allOf:
                  - {$ref: '#/components/responses/Problem/content/application~1problem+json/schema'}
                  - type: object
                    properties:
                      fields:
                        type: array
                        items:
                          type: object
                          required: [fieldName, transform, allowedTransforms]
                          properties:
                            fieldName: {type: string}
                            transform: {type: string}
                            allowedTransforms: {type: array, items: {$ref: '#/components/schemas/ValueReader'}}
        default:
          $ref: '#/components/responses/Problem'
  /sources/{sourceId}/onboarding-versions/{versionId}:
    get:
      operationId: getOnboardingVersion
      summary: Observe the governed onboarding state
      x-ouf-mcp-capability: ouf.source-onboarding.status.read
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': {description: Current immutable or draft version state}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateOnboardingDraft
      x-ouf-mcp-capability: ouf.source-onboarding.version.update
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}, {name: If-Match, in: header, required: true, schema: {type: string}}]
      responses: {'200': {description: DRAFT updated}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/clone:
    post:
      operationId: cloneOnboardingVersion
      x-ouf-mcp-capability: ouf.source-onboarding.version.clone
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'201': {description: DRAFT cloned from an immutable version}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/diff:
    get:
      operationId: diffOnboardingVersion
      x-ouf-mcp-capability: ouf.source-onboarding.version.diff
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'200': {description: Structured diff against parent or latest active version}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/extraction-profile/build:
    post:
      operationId: buildExtractionProfile
      x-ouf-mcp-capability: ouf.source-onboarding.extraction-profile.build
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'200': {description: Deterministic extraction profile projection}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps:
    get:
      operationId: listSemanticGaps
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-gap.read
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'200': {description: Semantic gaps for the DRAFT}, default: {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createSemanticGap
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-gap.create
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'201': {description: Semantic gap registered}, default: {$ref: '#/components/responses/Problem'}}
  /access-semantic-proposals:
    post:
      operationId: proposeAccessSchemaThroughGateway
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-gap.create
      description: Bounded Gateway entry for idempotent proposals from a DRAFT's pinned Access profile. No adoption or publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, versionId]
              properties:
                sourceId: {type: string, minLength: 1}
                versionId: {type: string, format: uuid}
      responses: {'200': {description: Schema proposals with immutable profile evidence}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps/from-access-schema:
    post:
      operationId: proposeAccessSchemaSemantics
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-gap.create
      description: Open idempotent proposals from the pinned Access profile, including composite keys and FK direction evidence. No semantic adoption or publication.
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'200': {description: Schema proposals with source evidence}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps/{gapId}/search:
    post:
      operationId: requestSemanticDiscovery
      x-ouf-mcp-capability: ouf.semantic.discovery.request
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/GapId'}]
      responses: {'202': {description: Semantic Registry handoff recorded}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps/{gapId}/candidates:
    post:
      operationId: reportSemanticCandidates
      x-ouf-internal-capability: ouf.semantic.discovery.result.report
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/GapId'}]
      responses: {'200': {description: Registry-owned candidates recorded}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps/{gapId}/select-candidate:
    post:
      operationId: selectSemanticCandidate
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-candidate.select
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/GapId'}]
      responses: {'200': {description: Candidate selected without semantic adoption}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/submit:
    post:
      operationId: submitOnboardingVersion
      summary: Freeze and submit a validated draft for human review
      x-ouf-mcp-capability: ouf.source-onboarding.submit
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/VersionId'
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      responses:
        '200': {description: Version frozen in IN_REVIEW}
        default: {$ref: '#/components/responses/Problem'}
  /sources/{sourceId}/onboarding-versions/{versionId}/approval-challenges:
    post:
      operationId: createTrustedApprovalHandoff
      summary: Create an opaque handoff to the direct HUMAN_USER approval surface
      description: MCP may create and return the handoff. Confirmation and activation are deliberately absent from the MCP surface.
      x-ouf-mcp-capability: ouf.source-onboarding.approval-handoff.create
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '201':
          description: Trusted approval handoff created
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, configuration_hash, expires_at, trustedApprovalRef]
                properties:
                  challenge_id: {type: string, format: uuid}
                  configuration_hash: {type: string}
                  expires_at: {type: string, format: date-time}
                  trustedApprovalRef: {type: string, pattern: '^ths://'}
                additionalProperties: true
        default: {$ref: '#/components/responses/Problem'}
  /sources/{sourceId}/types:
    get:
      operationId: listDiscoveredObjectTypes
      x-ouf-mcp-capability: source.discovery.type.list
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses: {'200': {description: Discovered object types and schema references}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/types/{typeCode}/fields:
    get:
      operationId: listDiscoveredTypeFields
      x-ouf-mcp-capability: source.discovery.schema.read
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: SCHEMA_ONLY field metadata without instances}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/types/{typeCode}/mapping:
    get:
      operationId: readObjectTypeMappingWorkspace
      x-ouf-mcp-capability: source.mapping.read
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Incremental mapping workspace}, default: {$ref: '#/components/responses/Problem'}}
    post:
      operationId: initializeObjectTypeMappingWorkspace
      x-ouf-mcp-capability: source.mapping.initialize
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Idempotently initialized workspace}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/types/{typeCode}/mapping/fields/{fieldName}:
    put:
      operationId: configureObjectTypeField
      x-ouf-mcp-capability: source.field.mapping.configure
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}, {name: fieldName, in: path, required: true, schema: {type: string}}, {name: If-Match, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FieldMappingDecision'}}}}
      responses: {'200': {description: Extraction, access and semantic field decision persisted and audited}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/types/{typeCode}/mapping/relationships:
    get:
      operationId: listRelationshipMappings
      x-ouf-mcp-capability: source.relationship.mapping.list
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Relationship mapping and runtime resolution policies}, default: {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    managedFileOwnerReceipt:
      type: apiKey
      in: header
      name: X-OUF-Managed-File-Receipt
      description: Short-lived signed HUMAN delegation from Gateway, bound to method, path, capability and body.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GapId:
      name: gapId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail]
            properties:
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
              code: {type: string}
              correlationId: {type: string}
  schemas:
    UnitUuid: {"type":"string","format":"uuid","pattern":"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
    UnitRef: {"type":"string","maxLength":16,"pattern":"^(table|sheet|layer|collection):(0|[1-9][0-9]{0,3})$"}
    SourceUnitReference: {"type":"object","additionalProperties":false,"required":["profileId","profileVersion","unitRef","schemaHash"],"properties":{"profileId":{"$ref":"#/components/schemas/UnitUuid"},"profileVersion":{"type":"integer","minimum":1,"maximum":2147483647},"unitRef":{"$ref":"#/components/schemas/UnitRef"},"schemaHash":{"type":"string","pattern":"^sha256:[0-9a-f]{64}$"}}}
    UnitSummary:
      type: object
      required: [unitCount, readyUnits]
      properties:
        unitCount: {type: integer, minimum: 0}
        readyUnits: {type: integer, minimum: 0}
        singleReadyUnitRef: {$ref: '#/components/schemas/UnitRef'}
    ManagedUnitExecutionProposal:
      type: object
      additionalProperties: false
      required: [contract, semanticBindings, semanticPublicationSetRef, udp, limits]
      properties:
        contract: {const: ouf.managed-unit-execution-proposal.v1}
        semanticBindings: {$ref: '../docs/contracts/managed-file-execution-proposal.schema.json#/properties/semanticBindings'}
        semanticPublicationSetRef: {$ref: '../docs/contracts/managed-file-execution-proposal.schema.json#/properties/semanticPublicationSetRef'}
        udp: {$ref: '../docs/contracts/managed-file-execution-proposal.schema.json#/properties/udp'}
        limits: {$ref: '../docs/contracts/managed-file-execution-proposal.schema.json#/properties/limits'}
    SourceUnitInventory:
      type: object
      required: [schema, sourceKind, origin, profileId, profileVersion, readerVersion, inventoryComplete, units, unitSummary, hasMore, nextOffset]
      properties:
        schema: {const: ouf.source-unit-inventory.v1}
        sourceKind: {const: FILE}
        origin: {$ref: '#/components/schemas/UnitOrigin'}
        profileId: {$ref: '#/components/schemas/UnitUuid'}
        profileVersion: {type: integer}
        readerVersion: {type: [string, 'null']}
        inventoryComplete: {type: boolean}
        unitSummary: {$ref: '#/components/schemas/UnitSummary'}
        units:
          type: array
          maxItems: 64
          items:
            type: object
            required: [unitRef, unitKind, name, status, hidden, recordCount, columnCount, hasGeometry]
            properties:
              unitRef: {$ref: '#/components/schemas/UnitRef'}
              unitKind: {enum: [TABLE, SHEET, LAYER]}
              name: {type: string}
              hidden: {type: boolean}
              status: {enum: [READY, REJECTED]}
              rejection: {$ref: '#/components/schemas/UnitRejection'}
              recordCount: {type: [integer, 'null']}
              columnCount: {type: [integer, 'null']}
              hasGeometry: {type: boolean}
        hasMore: {type: boolean}
        nextOffset: {type: [integer, 'null']}
    UnitRejection:
      type: object
      required: [code]
      properties: {code: {type: string}, at: {type: string}}
    UnitOrigin:
      type: object
      required: [assetId, mediaType]
      properties: {assetId: {$ref: '#/components/schemas/UnitUuid'}, mediaType: {type: string}}
    SourceUnitProfile:
      type: object
      required: [schema, view, sourceKind, origin, profileId, profileVersion, unitRef, unitKind, unitName, status, recordModel, schemaHash, columnsHash, limitsProfile, recordCount, columnCount, offset, columns, keys, geometry, readParameters, nextOffset, hasMore]
      properties:
        schema: {const: ouf.source-unit-profile.v1}
        view: {const: UNIT}
        unitRef: {$ref: '#/components/schemas/UnitRef'}
        sourceKind: {const: FILE}
        origin: {$ref: '#/components/schemas/UnitOrigin'}
        unitKind: {enum: [TABLE, SHEET, LAYER]}
        unitName: {type: string}
        profileId: {$ref: '#/components/schemas/UnitUuid'}
        profileVersion: {type: integer}
        recordModel: {enum: [ONE_ROW_ONE_SOURCE_OBJECT, ONE_FEATURE_ONE_SOURCE_OBJECT]}
        limitsProfile: {const: managed-tabular-1024.v1}
        status: {enum: [READY, REJECTED]}
        rejection: {$ref: '#/components/schemas/UnitRejection'}
        schemaHash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        columnsHash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        recordCount: {type: [integer, 'null']}
        columnCount: {type: [integer, 'null']}
        keys:
          type: object
          required: [declared, candidates]
          properties:
            declared: {type: array, items: {type: array, items: {type: string}}}
            candidates: {type: array, items: {type: array, items: {type: string}}}
        geometry:
          type: [object, 'null']
          required: [column, geometryType, dimensions, srsId, sourceCrs]
          properties:
            column: {type: string}
            geometryType: {type: string}
            dimensions: {const: 2}
            srsId: {type: integer}
            sourceCrs: {type: string}
            extent:
              type: object
              required: [minX, minY, maxX, maxY]
              additionalProperties: {type: number}
        readParameters:
          type: object
          minProperties: 1
          maxProperties: 1
          additionalProperties: false
          properties:
            csv:
              type: object
              required: [delimiter, encoding, headerRow]
              properties: {delimiter: {enum: [',', ';']}, encoding: {const: UTF-8}, headerRow: {const: 1}}
            xlsx:
              type: object
              required: [sheet, sheetIndex]
              properties:
                sheet: {type: string}
                sheetIndex: {type: integer, minimum: 0}
                headerRow: {type: integer, minimum: 1}
                dateSystem: {enum: ['1900', '1904']}
                timeZone: {type: string}
                cellText: {const: ouf.xlsx-cell-text.v1}
            geopackage:
              type: object
              required: [layer, geometryColumn, sourceCrs]
              properties: {layer: {type: string}, geometryColumn: {type: string}, sourceCrs: {type: string}}
        offset: {type: integer}
        columns:
          type: array
          maxItems: 128
          items:
            allOf:
              - {$ref: '#/components/schemas/ManagedMcpPreviewColumn'}
              - type: object
                required: [ordinal, nativeType, baseType, role]
                properties:
                  ordinal: {type: integer, minimum: 0}
                  nativeType: {type: string}
                  baseType: {enum: [string, integer, decimal, boolean, date, datetime, geometry]}
                  role: {enum: [ATTRIBUTE, GEOMETRY]}
        hasMore: {type: boolean}
        nextOffset: {type: [integer, 'null']}
    RegisterManagedFileRequest:
      type: object
      required: [stagingRef, contentHash, mediaType, sizeBytes, retentionRef]
      properties:
        sourceId: {type: [string, 'null']}
        stagingRef: {type: string, pattern: '^object://'}
        contentHash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        mediaType:
          type: string
          enum: [text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/geopackage+sqlite3, application/x-msaccess, application/vnd.ms-access, application/zip]
        sizeBytes: {type: integer, minimum: 1, maximum: 10485760}
        retentionRef: {type: string, minLength: 1}
    ManagedFileAsset:
      type: object
      required: [asset_id, staging_ref, content_hash, media_type, size_bytes, status]
      properties:
        asset_id: {type: string, format: uuid}
        source_id: {type: [string, 'null']}
        staging_ref: {type: string}
        content_hash: {type: string}
        media_type: {type: string}
        size_bytes: {type: integer}
        status: {type: string, enum: [STAGED, PROFILED, QUARANTINED]}
      additionalProperties: true
    FileProfileJob:
      type: object
      required: [jobId, status, createdAt, updatedAt]
      properties:
        unitSummary: {$ref: '#/components/schemas/UnitSummary'}
        jobId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        nextRetryAt: {type: [string, 'null'], format: date-time}
        resultRef: {type: [string, 'null']}
        errorCode: {type: [string, 'null']}
        job_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        state: {type: string, enum: [READY, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]}
        attempts: {type: integer, minimum: 0}
        profile_id: {type: [string, 'null'], format: uuid}
        error_code: {type: [string, 'null']}
      additionalProperties: true
    ColumnProfile:
      type: object
      required: [name, dataType, nullable, distinctValues]
      properties:
        name: {type: string}
        dataType: {type: string, enum: [STRING, LONG, DECIMAL, BOOLEAN, DATE]}
        nullable: {type: boolean}
        distinctValues: {type: integer, minimum: 0}
    FileProfile:
      type: object
      required: [profile_id, asset_id, version, format, inferred_schema, candidate_keys, redacted_sample]
      properties:
        unitSummary: {$ref: '#/components/schemas/UnitSummary'}
        profile_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        format: {type: string, enum: [CSV, XLSX, GEOPACKAGE, SHAPEFILE, ACCESS]}
        metadata: {type: object, additionalProperties: true}
        inferred_schema:
          type: array
          items: {$ref: '#/components/schemas/ColumnProfile'}
        candidate_keys:
          type: array
          items: {type: string}
          uniqueItems: true
        redacted_sample:
          type: array
          maxItems: 5
          items: {type: object, additionalProperties: {type: string}}
        sample_ref: {type: string}
      additionalProperties: true
    ManagedFilePreview:
      type: object
      required: [assetId, profileId, columns, candidateKeys, redactedSample, recordModel, identityProposal, proposalStatus]
      properties:
        assetId: {type: string, format: uuid}
        profileId: {type: string, format: uuid}
        columns:
          type: array
          items: {$ref: '#/components/schemas/ColumnProfile'}
        candidateKeys:
          type: array
          items: {type: string}
        redactedSample:
          type: array
          maxItems: 5
          items: {type: object, additionalProperties: {type: string}}
        recordModel: {const: ONE_ROW_ONE_SOURCE_OBJECT}
        identityProposal: {type: object, additionalProperties: true}
        proposalStatus: {const: PENDING_HUMAN_REVIEW}
      additionalProperties: true
    DistinctValuesCursor:
      type: string
      description: |
        Opaque, signed, and scoped to the tenant, subject, asset, profile, schema, column and position.
        It expires after the configured cursor TTL from the first page and contains no source values. Restart or key rotation
        can invalidate outstanding cursors. To obtain a new one, read the profile or column page again.
      minLength: 1
    ManagedMcpPreviewResponse:
      type: object
      required: [workflowState, reasonCode, allowedActions]
      properties:
        unitSummary: {$ref: '#/components/schemas/UnitSummary'}
        workflowState: {enum: [PROFILE_AVAILABLE, PROFILE_COLUMNS, ASSETS, QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]}
        reasonCode: {enum: [PROFILE_READY, COLUMN_PAGE, ASSET_LIST, PROFILE_PENDING, PROFILE_FAILED, PROFILE_CANCELLED]}
        allowedActions:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [READ_AGAIN, READ_DISTINCT_VALUES, NONE]}
          description: READ_DISTINCT_VALUES is present when a returned column has a continuation cursor.
      oneOf:
        - $ref: '#/components/schemas/SourceUnitInventory'
        - $ref: '#/components/schemas/SourceUnitProfile'
        - $ref: '#/components/schemas/ManagedMcpColumnPage'
        - $ref: '#/components/schemas/ManagedMcpProfilePreview'
        - type: object
          required: [jobId, status]
          properties:
            jobId: {type: string, format: uuid}
            status: {type: string}
            resultRef: {type: [string, 'null'], format: uuid}
            errorCode: {type: [string, 'null']}
            diagnosticCategory: {type: string}
            schemaHash: {type: string}
            columns:
              type: array
              items: {$ref: '#/components/schemas/ManagedMcpPreviewColumn'}
            columnCount: {type: integer, minimum: 1}
            offset: {type: integer, minimum: 0}
            hasMore: {type: boolean}
            nextOffset: {type: [integer, 'null'], minimum: 0}
        - type: object
          required: [items, hasMore]
          properties:
            items: {type: array, items: {type: object}}
            hasMore: {type: boolean}
    ManagedMcpPreviewColumn:
      type: object
      required: [name, dataType, nullable, distinctCount]
      properties:
        name: {type: string}
        dataType: {type: string}
        nullable: {type: boolean}
        distinctCount: {type: integer, minimum: 0}
        distinctValues:
          type: array
          maxItems: 2000
          items: {type: string, maxLength: 128}
          description: Ordered retained values for this slice of the column. An initial profile slice may be empty while a cursor is available.
        distinctValuesComplete:
          type: boolean
          description: True when there are no more values in the list. Present when distinctValues is exposed.
        distinctValuesCursor:
          $ref: '#/components/schemas/DistinctValuesCursor'
          description: Present when distinctValuesComplete is false.
    ManagedMcpColumnPage:
      type: object
      required: [view, assetId, profileId, profileVersion, format, schemaHash, columnCount, offset, columns, hasMore, nextOffset, limitsProfile]
      properties:
        view: {const: COLUMNS}
        assetId: {type: string, format: uuid}
        profileId: {type: string, format: uuid}
        profileVersion: {type: integer}
        format: {type: string}
        schemaHash: {type: string}
        limitsProfile: {type: string}
        layer: {type: string}
        columnCount: {type: integer, minimum: 1, maximum: 1024}
        offset: {type: integer, minimum: 0}
        columns:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/ManagedMcpPreviewColumn'}
        hasMore: {type: boolean}
        nextOffset: {type: [integer, 'null'], minimum: 0}
    ManagedMcpProfilePreview:
      type: object
      required: [assetId, profileId, profileVersion, format, schemaHash, columns, candidateKeys, redactedSample, recordModel, identityProposal, proposalStatus]
      properties:
        unitSummary: {$ref: '#/components/schemas/UnitSummary'}
        assetId: {type: string, format: uuid}
        profileId: {type: string, format: uuid}
        profileVersion: {type: integer}
        format: {type: string}
        schemaHash: {type: string}
        columns:
          type: array
          items: {$ref: '#/components/schemas/ManagedMcpPreviewColumn'}
        columnCount: {type: integer, minimum: 1}
        offset: {type: integer, minimum: 0}
        hasMore: {type: boolean}
        nextOffset: {type: [integer, 'null'], minimum: 0}
        candidateKeys: {type: array, items: {type: string}}
        candidateKeysTruncated: {const: true}
        redactedSample: {type: array, maxItems: 5, items: {type: object}}
        redactedSampleTruncated: {const: true}
        metadataTruncated:
          const: true
          description: |
            Layer detail was reduced to stay within the profile budget. Read columns with view COLUMNS
            and the layer name. The direct retained-profile API provides complete layer metadata.
        metadata:
          type: object
          properties:
            layers:
              type: array
              items:
                type: object
                properties:
                  layer: {type: string}
                  columnCount: {type: integer, minimum: 0}
                  columns:
                    type: array
                    items: {$ref: '#/components/schemas/ManagedMcpPreviewColumn'}
        recordModel: {const: ONE_ROW_ONE_SOURCE_OBJECT}
        identityProposal: {type: object}
        proposalStatus: {const: PENDING_HUMAN_REVIEW}
    CreateManagedFileOnboardingRequest:
      type: object
      required: [sourceId, name, owner, targetClassIri, semanticRefs]
      properties:
        unitProfileRef: {$ref: '#/components/schemas/SourceUnitReference'}
        sourceId: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        owner: {type: string, minLength: 1}
        targetClassIri: {type: string, minLength: 1}
        category:
          type: object
          additionalProperties: false
          required: [schemeIri, conceptIri]
          properties:
            schemeIri: {type: string, format: iri}
            conceptIri: {type: string, format: iri}
        semanticRefs:
          type: array
          minItems: 1
          items: {type: string}
        semanticBindings:
          type: array
          minItems: 1
          description: Optional exact bindings for draft reader verification, in execution proposal format.
          items:
            type: object
            additionalProperties: false
            required: [semanticId, semanticVersion, revisionId, publicationSetId]
            properties:
              semanticId: {type: string, minLength: 1}
              semanticVersion: {type: string, minLength: 1}
              revisionId: {type: string, format: uuid}
              publicationSetId: {type: string, format: uuid}
              reviewTerms:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [iri]
                  properties:
                    iri: {type: string, format: iri}
                    labelIt: {type: [string, 'null'], maxLength: 2048}
                    descriptionIt: {type: [string, 'null'], maxLength: 2048}
                    license: {type: [string, 'null'], maxLength: 2048}
        sourceObjectKeyFields:
          type: array
          items: {type: string}
          uniqueItems: true
        layer: {type: string}
        compositions: {$ref: '#/components/schemas/Compositions'}
        fields:
          type: array
          items: {$ref: '#/components/schemas/FieldDecision'}
      additionalProperties: false
    ValueReader:
      type: string
      enum: [IDENTITY, TEXT_NFC_TRIM_V1, INTEGER_V1, INTEGER_GROUP_DOT_V1, DECIMAL_DOT_V1, DECIMAL_COMMA_V1, DECIMAL_GROUP_DOT_COMMA_V1, DECIMAL_GROUP_COMMA_DOT_V1, BOOLEAN_IT_V1, DATE_ISO_V1, DATE_DMY_V1, DATE_DMY_DASH_V1, DATETIME_ISO_OFFSET_V1, DATETIME_LOCAL_ROME_V1, GEOJSON_V1, WKT_V1, VALUE_MAP_V1]
    TransformParams:
      type: object
      additionalProperties: false
      properties:
        crs: {type: string, pattern: '^EPSG:[0-9]+$'}
        valueMapRef: {type: string, minLength: 1}
    ConstructorExpression:
      type: object
      required: [constructorId, inputs]
      properties:
        constructorId: {enum: [POINT_FROM_LAT_LON_V1, TEXT_JOIN_V1, LIST_SPLIT_V1]}
        inputs:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [role, fieldName, reader]
            properties:
              role: {enum: [lat, lon, part, value]}
              fieldName: {type: string, minLength: 1}
              reader: {$ref: '#/components/schemas/ValueReader'}
              transformParams: {$ref: '#/components/schemas/TransformParams'}
        params:
          type: object
          additionalProperties: false
          properties:
            separator: {type: string, minLength: 1, maxLength: 8}
            itemReader: {$ref: '#/components/schemas/ValueReader'}
            itemReaderParams: {$ref: '#/components/schemas/TransformParams'}
          allOf:
            - if: {required: [itemReader], properties: {itemReader: {const: WKT_V1}}}
              then:
                required: [itemReaderParams]
                properties: {itemReaderParams: {required: [crs], maxProperties: 1}}
            - if: {required: [itemReader], properties: {itemReader: {const: VALUE_MAP_V1}}}
              then:
                required: [itemReaderParams]
                properties: {itemReaderParams: {required: [valueMapRef], maxProperties: 1}}
            - if: {properties: {itemReader: {not: {enum: [WKT_V1, VALUE_MAP_V1]}}}}
              then: {properties: {itemReaderParams: {maxProperties: 0}}}
      allOf:
        - if: {properties: {constructorId: {const: LIST_SPLIT_V1}}}
          then: {required: [params], properties: {params: {required: [separator, itemReader]}}}
        - if: {properties: {constructorId: {const: TEXT_JOIN_V1}}}
          then: {required: [params], properties: {params: {required: [separator], maxProperties: 1}}}
        - if: {properties: {constructorId: {const: POINT_FROM_LAT_LON_V1}}}
          then: {properties: {params: {maxProperties: 0}}}
    StructuredExpression:
      type: object
      required: [typeRef, components]
      properties:
        typeRef: {type: string, description: DATATYPE semanticId@publicationSetId}
        components:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            required: [component]
            properties:
              component: {type: string, pattern: '^[a-z][A-Za-z0-9]{0,63}$'}
            oneOf:
              - {$ref: '#/components/schemas/SingleComponentBuilder'}
              - required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SingleComponentBuilder'
                      properties:
                        constructor: {properties: {constructorId: {not: {const: LIST_SPLIT_V1}}}}
                      unevaluatedProperties: false
            unevaluatedProperties: false
    SingleComponentBuilder:
      type: object
      oneOf:
        - required: [fieldName, reader]
          properties:
            fieldName: {type: string, minLength: 1}
            reader: {$ref: '#/components/schemas/ValueReader'}
            transformParams: {$ref: '#/components/schemas/TransformParams'}
        - required: [constructor]
          properties:
            constructor:
              $ref: '#/components/schemas/ConstructorExpression'
              unevaluatedProperties: false
        - required: [structured]
          properties:
            structured:
              $ref: '#/components/schemas/StructuredExpression'
              unevaluatedProperties: false
    Compositions:
      type: array
      maxItems: 1024
      items:
        type: object
        required: [kind, targetPropertyIri, dataAccessLabel]
        properties:
          targetPropertyIri: {type: string, format: iri}
          dataAccessLabel: {enum: [OPEN, ANONYMOUS, PERSONAL, SENSITIVE, RESTRICTED]}
        oneOf:
          - $ref: '#/components/schemas/ConstructorExpression'
            properties: {kind: {const: CONSTRUCTOR}}
          - $ref: '#/components/schemas/StructuredExpression'
            properties: {kind: {const: STRUCTURED}}
        unevaluatedProperties: false
    RevisionArguments:
      type: object
      additionalProperties: false
      required: [sourceId, parentVersionId, expectedVersion, configurationHash, publicationEffect, commandKey]
      anyOf: [{required: [assetRef]}, {required: [unitProfileRef]}, {required: [changes]}, {required: [compositions]}]
      not: {anyOf: [{required: [assetRef, changes]}, {required: [unitProfileRef, changes]}, {required: [assetRef, unitProfileRef]}]}
      if: {required: [newColumns]}
      then: {anyOf: [{required: [assetRef]}, {required: [unitProfileRef]}]}
      properties:
        sourceId: {type: string}
        parentVersionId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 0}
        configurationHash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        commandKey: {type: string}
        publicationEffect: {const: NEW_PUBLICATION_MAY_START_ACQUISITION}
        compositions: {$ref: '#/components/schemas/Compositions'}
        changes:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [propertyIri, sourceField]
            anyOf: [{required: [reconciliation]}, {required: [transform]}, {required: [transformParams]}]
            properties:
              propertyIri: {type: string, format: iri}
              sourceField: {type: string}
              reconciliation: {type: object}
              transform: {$ref: '#/components/schemas/ValueReader'}
              transformParams: {$ref: '#/components/schemas/TransformParams'}
        unitProfileRef: {$ref: '#/components/schemas/SourceUnitReference'}
        assetRef:
          type: object
          additionalProperties: false
          required: [assetId, profileId]
          properties:
            assetId: {type: string, format: uuid}
            profileId: {type: string, format: uuid}
        newColumns:
          type: array
          maxItems: 1024
          items:
            type: object
            additionalProperties: false
            required: [column, decision]
            properties:
              column: {type: string}
              decision: {enum: [MAP, EXCLUDE]}
              mapping:
                type: object
                additionalProperties: false
                required: [propertyIri, transform, reconciliation]
                properties:
                  propertyIri: {type: string, format: iri}
                  transform: {$ref: '#/components/schemas/ValueReader'}
                  transformParams: {$ref: '#/components/schemas/TransformParams'}
                  reconciliation: {type: object}
                  accessLabel: {enum: [OPEN, ANONYMOUS, PERSONAL, SENSITIVE, RESTRICTED]}
                  authorityOrder: {type: array, items: {type: string}}
                  comparison:
                    type: object
                    required: [comparator, assertionRef]
                    additionalProperties: false
                    properties:
                      comparator: {enum: [TEXT_V1, DECIMAL_V1, JSON_V1, CONCEPT]}
                      assertionRef: {type: string}
    FieldDecision:
      type: object
      required: [fieldName, extractionDecision, dataAccessLabel]
      properties:
        fieldName: {type: string, minLength: 1}
        extractionDecision: {type: string, enum: [INCLUDE, EXCLUDE]}
        dataAccessLabel: {type: string, enum: [OPEN, ANONYMOUS, PERSONAL, SENSITIVE, RESTRICTED]}
        targetPropertyIri: {type: [string, 'null']}
        transform:
          anyOf: [{$ref: '#/components/schemas/ValueReader'}, {type: 'null'}]
        transformParams: {$ref: '#/components/schemas/TransformParams'}
        vocabularyId: {type: [string, 'null']}
        vocabularyVersion: {type: [string, 'null']}
        valueMapRef: {type: [string, 'null']}
      additionalProperties: false
    FieldMappingDecision:
      type: object
      required: [extractionDecision, dataAccessLabel]
      properties:
        extractionDecision: {type: string, enum: [INCLUDE, EXCLUDE]}
        dataAccessLabel: {type: string, enum: [OPEN, ANONYMOUS, PERSONAL, SENSITIVE, RESTRICTED]}
        targetPropertyIri: {type: [string, 'null']}
        transform: {type: [string, 'null']}
        vocabularyId: {type: [string, 'null']}
        vocabularyVersion: {type: [string, 'null']}
        valueMapRef: {type: [string, 'null']}
      additionalProperties: false
