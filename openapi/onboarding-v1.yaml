openapi: 3.1.0
info:
  title: OUF Source Onboarding API
  version: 1.0.0
  description: Managed-file onboarding control-plane capabilities. Runtime ingestion is explicitly outside this API.
servers:
  - url: /api/onboarding/v1
security:
  - bearerAuth: []
paths:
  /sources:
    get:
      operationId: listSources
      x-ouf-mcp-capability: ouf.source.list
      parameters: [{name: after, in: query, required: false, schema: {type: string}}, {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
      responses: {'200': {description: Cursor-ordered source page}, default: {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createSource
      x-ouf-mcp-capability: ouf.source.create
      responses: {'201': {description: Source created}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}:
    get:
      operationId: getSource
      x-ouf-mcp-capability: ouf.source.get
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses: {'200': {description: Source detail}, default: {$ref: '#/components/responses/Problem'}}
    patch:
      operationId: updateSource
      x-ouf-mcp-capability: ouf.source.update
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: If-Match, in: header, required: true, schema: {type: string}}]
      responses: {'200': {description: Mutable source metadata updated}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions:
    post:
      operationId: createOnboardingVersion
      x-ouf-mcp-capability: ouf.source-onboarding.version.create
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses: {'201': {description: DRAFT created}, default: {$ref: '#/components/responses/Problem'}}
  /managed-files:
    post:
      operationId: registerManagedFile
      summary: Register a file already uploaded to governed staging
      x-ouf-mcp-capability: ouf.managed-source.file.upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterManagedFileRequest'
      responses:
        '201':
          description: ManagedFileAsset registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedFileAsset'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/profile:
    post:
      operationId: requestManagedFileProfile
      summary: Queue deterministic profiling
      x-ouf-mcp-capability: ouf.managed-source.file.profile
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '202':
          description: Profiling job accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileProfileJob'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/profile-jobs/{jobId}:
    get:
      operationId: getManagedFileProfileJob
      summary: Get profiling job state
      x-ouf-mcp-capability: ouf.managed-source.file.profile
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current profiling job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileProfileJob'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/profiles/{profileId}:
    get:
      operationId: getManagedFileProfile
      summary: Get immutable technical profile
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Immutable FileProfile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileProfile'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/profiles/{profileId}/preview:
    get:
      operationId: previewManagedFileOnboarding
      summary: Preview schema, redacted sample, candidate keys and row-object proposal
      x-ouf-mcp-capability: ouf.managed-source.preview
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Governed preview safe for an agent or UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedFilePreview'
        default:
          $ref: '#/components/responses/Problem'
  /managed-files/{assetId}/create-onboarding:
    post:
      operationId: createManagedFileOnboarding
      summary: Create an INTERNAL_MANAGED source and DRAFT configuration
      x-ouf-mcp-capability: ouf.managed-source.onboarding.create
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: profileId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedFileOnboardingRequest'
      responses:
        '201':
          description: Governed onboarding DRAFT created; no ingestion has started
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Problem'
  /sources/{sourceId}/onboarding-versions/{versionId}:
    get:
      operationId: getOnboardingVersion
      summary: Observe the governed onboarding state
      x-ouf-mcp-capability: ouf.source-onboarding.status.read
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': {description: Current immutable or draft version state}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateOnboardingDraft
      x-ouf-mcp-capability: ouf.source-onboarding.version.update
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}, {name: If-Match, in: header, required: true, schema: {type: string}}]
      responses: {'200': {description: DRAFT updated}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/clone:
    post:
      operationId: cloneOnboardingVersion
      x-ouf-mcp-capability: ouf.source-onboarding.version.clone
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'201': {description: DRAFT cloned from an immutable version}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/diff:
    get:
      operationId: diffOnboardingVersion
      x-ouf-mcp-capability: ouf.source-onboarding.version.diff
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'200': {description: Structured diff against parent or latest active version}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/extraction-profile/build:
    post:
      operationId: buildExtractionProfile
      x-ouf-mcp-capability: ouf.source-onboarding.extraction-profile.build
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'200': {description: Deterministic extraction profile projection}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps:
    get:
      operationId: listSemanticGaps
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-gap.read
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'200': {description: Semantic gaps for the DRAFT}, default: {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createSemanticGap
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-gap.create
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'201': {description: Semantic gap registered}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps/from-access-schema:
    post:
      operationId: proposeAccessSchemaSemantics
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-gap.create
      description: Open idempotent proposals from the pinned Access profile, including composite keys and FK direction evidence. No semantic adoption or publication.
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}]
      responses: {'200': {description: Schema proposals with source evidence}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps/{gapId}/search:
    post:
      operationId: requestSemanticDiscovery
      x-ouf-mcp-capability: ouf.semantic.discovery.request
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/GapId'}]
      responses: {'202': {description: Semantic Registry handoff recorded}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps/{gapId}/candidates:
    post:
      operationId: reportSemanticCandidates
      x-ouf-internal-capability: ouf.semantic.discovery.result.report
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/GapId'}]
      responses: {'200': {description: Registry-owned candidates recorded}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/semantic-gaps/{gapId}/select-candidate:
    post:
      operationId: selectSemanticCandidate
      x-ouf-mcp-capability: ouf.source-onboarding.semantic-candidate.select
      parameters: [{$ref: '#/components/parameters/SourceId'}, {$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/GapId'}]
      responses: {'200': {description: Candidate selected without semantic adoption}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/onboarding-versions/{versionId}/submit:
    post:
      operationId: submitOnboardingVersion
      summary: Freeze and submit a validated draft for human review
      x-ouf-mcp-capability: ouf.source-onboarding.submit
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/VersionId'
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      responses:
        '200': {description: Version frozen in IN_REVIEW}
        default: {$ref: '#/components/responses/Problem'}
  /sources/{sourceId}/onboarding-versions/{versionId}/approval-challenges:
    post:
      operationId: createTrustedApprovalHandoff
      summary: Create an opaque handoff to the direct HUMAN_USER approval surface
      description: MCP may create and return the handoff. Confirmation and activation are deliberately absent from the MCP surface.
      x-ouf-mcp-capability: ouf.source-onboarding.approval-handoff.create
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '201':
          description: Trusted approval handoff created
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, configuration_hash, expires_at, trustedApprovalRef]
                properties:
                  challenge_id: {type: string, format: uuid}
                  configuration_hash: {type: string}
                  expires_at: {type: string, format: date-time}
                  trustedApprovalRef: {type: string, pattern: '^ths://'}
                additionalProperties: true
        default: {$ref: '#/components/responses/Problem'}
  /sources/{sourceId}/types:
    get:
      operationId: listDiscoveredObjectTypes
      x-ouf-mcp-capability: source.discovery.type.list
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses: {'200': {description: Discovered object types and schema references}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/types/{typeCode}/fields:
    get:
      operationId: listDiscoveredTypeFields
      x-ouf-mcp-capability: source.discovery.schema.read
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: SCHEMA_ONLY field metadata without instances}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/types/{typeCode}/mapping:
    get:
      operationId: readObjectTypeMappingWorkspace
      x-ouf-mcp-capability: source.mapping.read
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Incremental mapping workspace}, default: {$ref: '#/components/responses/Problem'}}
    post:
      operationId: initializeObjectTypeMappingWorkspace
      x-ouf-mcp-capability: source.mapping.initialize
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Idempotently initialized workspace}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/types/{typeCode}/mapping/fields/{fieldName}:
    put:
      operationId: configureObjectTypeField
      x-ouf-mcp-capability: source.field.mapping.configure
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}, {name: fieldName, in: path, required: true, schema: {type: string}}, {name: If-Match, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FieldMappingDecision'}}}}
      responses: {'200': {description: Extraction, access and semantic field decision persisted and audited}, default: {$ref: '#/components/responses/Problem'}}
  /sources/{sourceId}/types/{typeCode}/mapping/relationships:
    get:
      operationId: listRelationshipMappings
      x-ouf-mcp-capability: source.relationship.mapping.list
      parameters: [{$ref: '#/components/parameters/SourceId'}, {name: typeCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Relationship mapping and runtime resolution policies}, default: {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GapId:
      name: gapId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail]
            properties:
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
              code: {type: string}
              correlationId: {type: string}
  schemas:
    RegisterManagedFileRequest:
      type: object
      required: [stagingRef, contentHash, mediaType, sizeBytes, retentionRef]
      properties:
        sourceId: {type: [string, 'null']}
        stagingRef: {type: string, pattern: '^object://'}
        contentHash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        mediaType:
          type: string
          enum: [text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
        sizeBytes: {type: integer, minimum: 1, maximum: 10485760}
        retentionRef: {type: string, minLength: 1}
    ManagedFileAsset:
      type: object
      required: [asset_id, staging_ref, content_hash, media_type, size_bytes, status]
      properties:
        asset_id: {type: string, format: uuid}
        source_id: {type: [string, 'null']}
        staging_ref: {type: string}
        content_hash: {type: string}
        media_type: {type: string}
        size_bytes: {type: integer}
        status: {type: string, enum: [STAGED, PROFILED, QUARANTINED]}
      additionalProperties: true
    FileProfileJob:
      type: object
      required: [jobId, status, createdAt, updatedAt]
      properties:
        jobId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        nextRetryAt: {type: [string, 'null'], format: date-time}
        resultRef: {type: [string, 'null']}
        errorCode: {type: [string, 'null']}
        job_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        state: {type: string, enum: [READY, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]}
        attempts: {type: integer, minimum: 0}
        profile_id: {type: [string, 'null'], format: uuid}
        error_code: {type: [string, 'null']}
      additionalProperties: true
    ColumnProfile:
      type: object
      required: [name, dataType, nullable, distinctValues]
      properties:
        name: {type: string}
        dataType: {type: string, enum: [STRING, LONG, DECIMAL, BOOLEAN, DATE]}
        nullable: {type: boolean}
        distinctValues: {type: integer, minimum: 0}
    FileProfile:
      type: object
      required: [profile_id, asset_id, version, format, inferred_schema, candidate_keys, redacted_sample]
      properties:
        profile_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        format: {type: string, enum: [CSV, XLSX, GEOPACKAGE, SHAPEFILE, ACCESS]}
        metadata: {type: object, additionalProperties: true}
        inferred_schema:
          type: array
          items: {$ref: '#/components/schemas/ColumnProfile'}
        candidate_keys:
          type: array
          items: {type: string}
          uniqueItems: true
        redacted_sample:
          type: array
          maxItems: 5
          items: {type: object, additionalProperties: {type: string}}
        sample_ref: {type: string}
      additionalProperties: true
    ManagedFilePreview:
      type: object
      required: [assetId, profileId, columns, candidateKeys, redactedSample, recordModel, identityProposal, proposalStatus]
      properties:
        assetId: {type: string, format: uuid}
        profileId: {type: string, format: uuid}
        columns:
          type: array
          items: {$ref: '#/components/schemas/ColumnProfile'}
        candidateKeys:
          type: array
          items: {type: string}
        redactedSample:
          type: array
          maxItems: 5
          items: {type: object, additionalProperties: {type: string}}
        recordModel: {const: ONE_ROW_ONE_SOURCE_OBJECT}
        identityProposal: {type: object, additionalProperties: true}
        proposalStatus: {const: PENDING_HUMAN_REVIEW}
      additionalProperties: true
    CreateManagedFileOnboardingRequest:
      type: object
      required: [sourceId, name, owner, targetClassIri, semanticRefs]
      properties:
        sourceId: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        owner: {type: string, minLength: 1}
        targetClassIri: {type: string, minLength: 1}
        semanticRefs:
          type: array
          minItems: 1
          items: {type: string}
        sourceObjectKeyFields:
          type: array
          items: {type: string}
          uniqueItems: true
        fields:
          type: array
          items: {$ref: '#/components/schemas/FieldDecision'}
      additionalProperties: false
    FieldDecision:
      type: object
      required: [fieldName, extractionDecision, dataAccessLabel]
      properties:
        fieldName: {type: string, minLength: 1}
        extractionDecision: {type: string, enum: [INCLUDE, EXCLUDE]}
        dataAccessLabel: {type: string, enum: [OPEN, ANONYMOUS, PERSONAL, SENSITIVE, RESTRICTED]}
        targetPropertyIri: {type: [string, 'null']}
        transform: {type: [string, 'null']}
        vocabularyId: {type: [string, 'null']}
        vocabularyVersion: {type: [string, 'null']}
        valueMapRef: {type: [string, 'null']}
      additionalProperties: false
    FieldMappingDecision:
      type: object
      required: [extractionDecision, dataAccessLabel]
      properties:
        extractionDecision: {type: string, enum: [INCLUDE, EXCLUDE]}
        dataAccessLabel: {type: string, enum: [OPEN, ANONYMOUS, PERSONAL, SENSITIVE, RESTRICTED]}
        targetPropertyIri: {type: [string, 'null']}
        transform: {type: [string, 'null']}
        vocabularyId: {type: [string, 'null']}
        vocabularyVersion: {type: [string, 'null']}
        valueMapRef: {type: [string, 'null']}
      additionalProperties: false
